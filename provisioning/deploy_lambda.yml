---
- name: Deploy Lambda function for syncing ASG instances using EventBridge
  hosts: localhost
  vars:
    token: "12932"
    aws_region: "us-west-2"
    lambda_execution_role: "arn:aws:iam::123456789012:role/lambda-execution-role"
    lambda_code_dir: "/tmp/lambda_code"  # Directory where Lambda code and dependencies will reside
    lambda_function_file: "lambda_function.py"  # Your Lambda function file name
    dependencies_dir: "dependencies"  # Directory for dependencies

  tasks:
    - name: Import IDs
      include_vars: ../vars/vpc-output_vars

    - name: Create directory for Lambda code and dependencies
      ansible.builtin.file:
        path: "{{ lambda_code_dir }}"
        state: directory

    - name: Create a directory for Python dependencies
      ansible.builtin.file:
        path: "{{ lambda_code_dir }}/{{ dependencies_dir }}"
        state: directory

    - name: Create a virtual environment for dependencies
      ansible.builtin.shell: |
        python3 -m venv {{ lambda_code_dir }}/{{ dependencies_dir }}/venv
      args:
        creates: "{{ lambda_code_dir }}/{{ dependencies_dir }}/venv"

    - name: Install Python dependencies into the virtual environment
      pip:
        name:
          - requests  # Add other dependencies here if needed
        virtualenv: "{{ lambda_code_dir }}/{{ dependencies_dir }}/venv"

    - name: Copy lambda_function.py to the Lambda code directory
      ansible.builtin.copy:
        src: "{{ lambda_function_file }}"
        dest: "{{ lambda_code_dir }}/{{ lambda_function_file }}"

    - name: Copy the virtual environment site-packages to the Lambda code directory
      ansible.builtin.command:
        cmd: |
          cp -r {{ lambda_code_dir }}/{{ dependencies_dir }}/venv/lib/python*/site-packages/* {{ lambda_code_dir }}/{{ dependencies_dir }}
        creates: "{{ lambda_code_dir }}/{{ dependencies_dir }}/site-packages-copied"

    - name: Create a zip archive of the Lambda function and dependencies
      community.general.archive:
        path: "{{ lambda_code_dir }}"
        format: zip
        dest: "/tmp/lambda_function.zip"  # Final zip file path for deployment

    - name: Upload Lambda code to S3
      aws_s3:
        bucket: "{{ s3OUT }}"  # Specify the S3 bucket name
        object: lambda_function.zip
        src: /tmp/lambda_function.zip
        mode: put

    - name: Create Lambda function to sync S3 on instance launch
      amazon.aws.lambda:
        region: "{{ aws_region }}"
        state: present
        name: "asg-instance-sync"
        runtime: python3.9
        handler: lambda_function.lambda_handler  # This should match the file and function inside your lambda_function.py
        s3_bucket: "{{ s3OUT }}"
        s3_key: "lambda_function.zip"
        role: "{{ lambda_execution_role }}"
        timeout: 60
        memory_size: 128
        environment_variables:
          S3_BUCKET_NAME: "{{ s3OUT }}"  # Set your bucket name here
      register: lambda_out

    - name: Get the Lambda function ARN without the version
      command: >
        aws lambda get-function
        --region "{{ aws_region }}"
        --function-name "{{ lambda_out.configuration.function_name }}"
        --query 'Configuration.FunctionArn'
        --output text
      register: lambda_function_arn

    - debug:
        var: "{{ lambda_function_arn.stdout.strip() }}"

