---
- hosts: localhost
  connection: local
  gather_facts: False
  vars:
    template_url: "https://www.tooplate.com/zip-templates/2098_health.zip"
    download_path: "/tmp/website_template.zip"
    unzip_path: "/tmp/website_files"
    region: "us-east-2"
  tasks:
    # Create a simple S3 bucket
    - name: Import S3 Bucket Name
      ansible.builtin.include_vars:
        file: ../vars/vpc-output_vars

    - name: Install the package "unzip"
      ansible.builtin.apt:
        name: unzip
        state: present
      become: true
    - name: Create directory for website files
      file:
        path: "{{ unzip_path}}"
        state: directory
        mode: '0755'

    - name: Download website template
      get_url:
        url: "{{ template_url }}"
        dest: "{{ download_path }}"
    - name: Unzip website template
      unarchive:
        src: "{{ download_path }}"
        dest: "{{ unzip_path }}"
        remote_src: no

    - name: Upload static files to S3 Bucket using AWS CLI
      shell: >
        aws s3 cp {{ unzip_path }}/* s3://{{ s3_out.name }}/ --recursive


    - name: Delete local template ZIP
      file:
        path: "{{ download_path }}"
        state: absent
    - name: Delete unzipped website files
      file:
        path: "{{ unzip_path }}"
        state: absent

    

