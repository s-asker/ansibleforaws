- name: Clone repo and deploy to Apache root
  hosts: websrvgrp
  become: true
  tasks:
    - name: Ensure previous clone is removed
      ansible.builtin.file:
        path: /tmp/ansibleforaws
        state: absent

    - name: Clone repo to /tmp with .git
      ansible.builtin.git:
        repo: https://github.com/s-asker/ansibleforaws.git
        dest: /tmp/ansibleforaws
        version: website
        force: yes

    - name: Clear Apache root directory
      ansible.builtin.file:
        path: /var/www/html
        state: absent

    - name: Recreate Apache root directory
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Copy cloned content to Apache root (including .git)
      ansible.builtin.shell: |
        cp -a /tmp/ansibleforaws/. /var/www/html/
      args:
        executable: /bin/bash

