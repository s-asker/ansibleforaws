---
- name: s3 mounting play
  hosts: websrvgrp
  become: true
  gather_facts: false
  vars:
    mount_path: "/var/www/html"
  tasks:
    - name: Import IDs
      include_vars: ../vars/vpc-output_vars

    - name: Clone repo, move contents, and cleanup (including .git)
      ansible.builtin.shell: |
        set -e
        rm -rf {{ mount_path }}/*
        cd /home/ubuntu
        git clone --branch website https://github.com/s-asker/ansibleforaws.git temp_repo
        shopt -s dotglob
        mv -r temp_repo/* /var/www/html
        rm -rf temp_repo
      args:
        executable: /bin/bash
      become: true
