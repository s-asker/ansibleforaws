---
- name: s3 mounting play
  hosts: websrvgrp
  become: true
  gather_facts: False
  vars:
    mount_path: "/var/www/html"
  tasks:
    - name: Import IDs
      include_vars: ../vars/vpc-output_vars

    - name: Clear /var/www/html/ in worker nodes
      ansible.builtin.shell: sudo rm -rf {{ mount_path }}/*
      become: true
      ignore_errors: yes

    - name: Clone the repo and checkout the website branch
      ansible.builtin.git:
        repo: https://github.com/s-asker/ansibleforaws.git
        dest: "{{ mount_path }}/ansibleforaws"
        version: website

    - name: Move files from ansibleforaws to /var/www/html
      ansible.builtin.command:
        cmd: mv {{ mount_path }}/ansibleforaws/* {{ mount_path }}/
      become: true
      ignore_errors: yes

    - name: Remove the cloned directory
      ansible.builtin.file:
        path: "{{ mount_path }}/ansibleforaws"
        state: absent
      become: true
