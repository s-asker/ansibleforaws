---
- name: s3 mounting play
  hosts: websrvgrp
  become: true
  gather_facts: False
  vars:
    mount_path: "/var/www/html"
  tasks:
    - name: Import IDs
      include_vars: ../vars/vpc-output_vars

    - name: Clear /var/www/html/ in worker nodes
      ansible.builtin.shell: sudo rm -rf {{mount_path}}/*
      become: true
      ignore_errors: yes

    - name: Install the package "s3fs-fuse"
      ansible.builtin.apt:
        name:
          - s3fs
        state: present
      become: true


    - name: Mount S3 bucket to /var/www/html using s3fs with proper permissions
      shell: |
        echo "{{ s3OUT }} {{ mount_path }} fuse.s3fs _netdev,allow_other,uid=www-data,gid=www-data,umask=0022,use_cache=/tmp 0 0" >> /etc/fstab
        s3fs {{ s3OUT }} {{ mount_path }} -o iam_role=auto,allow_other,uid=www-data,gid=www-data,umask=0022,use_cache=/tmp
      become: true

